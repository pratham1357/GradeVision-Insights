name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gradevision
          POSTGRES_PASSWORD: gradevision_dev_pw
          POSTGRES_DB: gradevision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradevision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A dedicated TEST database: the integration suites create/delete fixture rows.
      DATABASE_URL: postgresql://gradevision:gradevision_dev_pw@localhost:5432/gradevision_test?schema=public
      # CI-only throwaway values; real deployments inject strong secrets.
      SESSION_SECRET: ci-only-session-secret-ci-only-session-secret
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-ci-only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Library packages must be built before the apps can typecheck against them.
      - run: pnpm --filter @gradevision/database generate
      - run: >-
          pnpm --filter @gradevision/shared --filter @gradevision/database
          --filter @gradevision/grading --filter @gradevision/queue build

      # The Python AST semantic analyzer shells out to `python3`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @gradevision/database exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @gradevision/database exec tsx prisma/seed.ts

      # Runs after the schema exists: the `instructor` suite is a real DB integration test.
      - run: pnpm test
