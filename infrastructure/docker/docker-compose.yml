# Local development infrastructure for GradeVision Insights.
#
#   # everything (app DB + Redis + self-hosted Judge0):
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
#   # just the app DB + Redis (recommended on Windows/macOS - see the note below):
#   docker compose -f infrastructure/docker/docker-compose.yml up -d postgres redis
#
# Services:
#   postgres  - the application database (matches DATABASE_URL in .env)
#   redis     - optional BullMQ queue for the evaluator (REDIS_URL in .env)
#   judge0 + judge0-workers + judge0-db + judge0-redis - the code-execution sandbox
#
# ── Judge0 / Docker Desktop limitation ──────────────────────────────────────────
# Judge0 1.13.1 requires PRIVILEGED containers and cgroup v1 with
# `cgroup_enable=memory swapaccount=1` on the host kernel. This works on most
# native Linux hosts. On Docker Desktop for Windows/macOS (cgroup v2, no swap
# accounting) the `judge0-workers` container will fail to isolate submissions.
#
# When Judge0 is unavailable, leave JUDGE0_URL unset: the evaluator marks each
# run FAILED with `EXECUTION_UNAVAILABLE` and a clear message. The rest of the
# platform (queueing, grading of mocked runs in tests, hints, results,
# integrity, realtime) is unaffected. To get real execution on Windows, run this
# stack inside a Linux VM / WSL2 with cgroup v1, or point JUDGE0_URL at a
# separately hosted Judge0.

name: gradevision

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradevision
      POSTGRES_PASSWORD: gradevision_dev_pw
      POSTGRES_DB: gradevision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradevision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Judge0 self-hosted code-execution sandbox -------------------------------
  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]

  judge0:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2358/languages >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0
      - judge0-db
      - judge0-redis

volumes:
  postgres-data:
  redis-data:
  judge0-db-data:
