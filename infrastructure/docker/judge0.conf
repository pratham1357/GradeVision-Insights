# Judge0 configuration for local development only.
# Full reference: https://github.com/judge0/judge0/blob/master/judge0.conf

RAILS_ENV=production
# Judge0 server + workers read DB/Redis from here; the judge0-db / judge0-redis
# compose services also load this file (env_file) for their own credentials.

# Redis (used by Judge0's internal job queue)
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=

# PostgreSQL
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_dev_pw

# Optional shared token. If set here, also set JUDGE0_TOKEN in the app .env so
# the evaluator sends `X-Auth-Token`. Left blank for local dev.
AUTHN_TOKEN=
AUTHZ_TOKEN=

# Resource ceilings (the evaluator also sends per-submission limits derived from
# the question). Keep these as generous backstops.
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=25
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=120
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOW_ENABLE_NETWORK=false
