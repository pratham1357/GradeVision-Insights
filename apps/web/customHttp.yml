# Amplify Hosting custom headers for the web app (apps/web).
#
# The Content-Security-Policy below was exercised locally against the production
# build (apps/web/dist served with these headers; browser smoke 28/28, no CSP
# violations). Replace API_ORIGIN with the real API origin, e.g.
# https://api.example.edu and wss://api.example.edu, before deploying.
customHeaders:
  - pattern: "**"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://API_ORIGIN wss://API_ORIGIN; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: X-Frame-Options
        value: "DENY"
      - key: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
  - pattern: "assets/**"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  - pattern: "index.html"
    headers:
      - key: Cache-Control
        value: "no-cache"
